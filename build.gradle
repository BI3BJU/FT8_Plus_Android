// Top-level build file
buildscript {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
