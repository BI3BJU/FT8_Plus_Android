apply plugin: 'com.android.application'

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'com.bi3bju.ft8_plus'
    compileSdk 33

    defaultConfig {
        applicationId "com.bi3bju.ft8_plus"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11"
                abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Disable lint vital checks for release builds. This works around
    // the AGP 8.x Lint verifier crashing with a bare version string
    // ("25.0.3") that aborts `assembleRelease` and blocks APK output.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // implementation 'commons-net:commons-net:3.9'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}